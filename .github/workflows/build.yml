name: Build and Release XUiDa64

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller Pillow

    - name: Install Inno Setup
      run: |
        choco install innosetup -y --no-progress
        echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Generate brand assets
      run: |
        python generate_assets.py

    - name: Build Standalone Executable
      run: |
        python build_exe.py

    - name: Build Windows Installer
      run: |
        iscc installer\XUiDa64_Setup.iss

    - name: Archive Windows Portable Zip
      run: |
        Compress-Archive -Force -Path dist\XUiDa64 -DestinationPath XUiDa64-win64.zip

    - name: Upload Windows Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: XUiDa64-Windows-Installer
        path: dist\XUiDa64-Setup-v1.0.0.exe

    - name: Upload Windows Portable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: XUiDa64-Windows-Portable
        path: XUiDa64-win64.zip

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install system GUI dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libgl1 \
          libegl1 \
          libxkbcommon-x11-0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-xinerama0 \
          libxcb-xfixes0 \
          libxcb-shape0

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller Pillow

    - name: Generate brand assets
      run: |
        python generate_assets.py

    - name: Build Standalone Executable
      run: |
        python build_exe.py

    - name: Archive Linux Package
      run: |
        tar -czvf XUiDa64-linux-x64.tar.gz -C dist XUiDa64

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: XUiDa64-Linux-x64
        path: XUiDa64-linux-x64.tar.gz

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Download all release artifacts
      uses: actions/download-artifact@v4
      with:
        merge-multiple: true
        path: release-assets

    - name: List downloaded assets
      run: ls -la release-assets

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "XUiDa64 Extreme Edition v1.0.0"
        files: release-assets/*
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
